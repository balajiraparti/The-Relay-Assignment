[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-assignment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "python-dotenv>=1,<2", "pydantic-settings>=2,<3", "pypdf>=5,<7",
  "langchain-text-splitters>=0.3,<2", "sentence-transformers>=3,<6",
  "faiss-cpu>=1.9,<2", "rank-bm25>=0.2,<1", "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
